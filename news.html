<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tech News · PriceDrop QA</title>
<meta name="description" content="Latest Android and iPhone news from top tech sites, updated every 30 minutes.">
<meta name="theme-color" content="#0f172a">
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#e11d48; --android:#16a34a; --iphone:#2563eb; --general:#7c3aed;
  --chip:#eef0f3; --chip-on:#111827; --chip-on-text:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1020; --card:#141a2e; --text:#f3f4f6; --muted:#9ca3af; --line:#232b45;
    --chip:#1c2340; --chip-on:#f3f4f6; --chip-on-text:#0b1020;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.brand{font-weight:800;font-size:19px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.updated{margin-left:auto;font-size:12px;color:var(--muted)}
.refresh{border:0;background:var(--chip);color:var(--text);width:34px;height:34px;
  border-radius:50%;font-size:16px;cursor:pointer}
.search{width:100%;margin:10px 0 8px;padding:10px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);color:var(--text);font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;padding:7px 13px;border-radius:999px;background:var(--chip);
  color:var(--text);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--chip-on);color:var(--chip-on-text)}
main{max-width:760px;margin:0 auto;padding:12px 16px 40px}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin-bottom:10px;text-decoration:none;color:inherit}
.card:active{transform:scale(.99)}
.thumb{flex:none;width:96px;height:96px;border-radius:10px;object-fit:cover;background:var(--chip)}
.body{min-width:0;display:flex;flex-direction:column}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.tag{font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
  padding:2px 6px;border-radius:5px;color:#fff}
.tag.android{background:var(--android)} .tag.iphone{background:var(--iphone)} .tag.general{background:var(--general)}
h2{font-size:15.5px;line-height:1.3;margin:0 0 4px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
p{margin:0;font-size:13px;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.hero{flex-direction:column}
.card.hero .thumb{width:100%;height:190px}
.card.hero h2{font-size:18px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
.more{display:block;margin:6px auto 0;border:0;background:var(--chip);color:var(--text);
  padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer}
footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 30px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">PriceDrop<span>QA</span> · News</div>
    <div class="updated" id="updated"></div>
    <button class="refresh" id="refresh" aria-label="Refresh">↻</button>
  </div>
  <input class="search" id="q" type="search" placeholder="Search news (e.g. Galaxy S26, iOS 27)">
  <div class="chips" id="cats"></div>
  <div class="chips" id="srcs" style="margin-top:6px"></div>
</header>

<main id="list"><div class="empty">Loading news…</div></main>
<footer>Headlines link to the original publishers. All rights belong to their respective owners.</footer>

<script>
const NEWS_URL = "news.json";
const PAGE = 30;
let all = [], cat = "all", src = "all", query = "", shown = PAGE;

const CATS = [["all","All"],["android","Android"],["iphone","iPhone"],["general","Tech"]];

function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
function esc(t){ const d=document.createElement("div"); d.textContent=t||""; return d.innerHTML; }

function chips(el, list, current, onPick){
  el.innerHTML = list.map(([v,l]) =>
    `<button class="chip ${v===current?"on":""}" data-v="${esc(v)}">${esc(l)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest(".chip"); if (b) onPick(b.dataset.v); };
}

function renderChips(){
  chips(document.getElementById("cats"), CATS, cat, v => { cat=v; shown=PAGE; render(); });
  const names = [...new Map(all.map(i => [i.source, i.source])).keys()].sort();
  chips(document.getElementById("srcs"), [["all","All sources"], ...names.map(n=>[n,n])], src,
        v => { src=v; shown=PAGE; render(); });
}

function render(){
  renderChips();
  const q = query.toLowerCase();
  const items = all.filter(i =>
    (cat==="all" || i.category===cat) &&
    (src==="all" || i.source===src) &&
    (!q || (i.title+" "+i.summary).toLowerCase().includes(q)));
  const list = document.getElementById("list");
  if (!items.length){ list.innerHTML = `<div class="empty">No news found.</div>`; return; }
  list.innerHTML = items.slice(0, shown).map((i, n) => `
    <a class="card ${n===0 && i.image ? "hero" : ""}" href="${esc(i.link)}" target="_blank" rel="noopener">
      ${i.image ? `<img class="thumb" src="${esc(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}
      <div class="body">
        <div class="meta"><span class="tag ${i.category}">${i.category==="general"?"Tech":i.category==="iphone"?"iPhone":"Android"}</span>
          <span>${esc(i.source)}</span>·<span>${ago(i.published)}</span></div>
        <h2>${esc(i.title)}</h2>
        ${i.summary ? `<p>${esc(i.summary)}</p>` : ""}
      </div>
    </a>`).join("") +
    (items.length > shown ? `<button class="more" id="more">Load more</button>` : "");
  const more = document.getElementById("more");
  if (more) more.onclick = () => { shown += PAGE; render(); };
}

async function load(){
  try{
    const r = await fetch(NEWS_URL + "?t=" + Date.now());
    const data = await r.json();
    all = data.items || [];
    document.getElementById("updated").textContent = "Updated " + ago(data.updated);
    render();
  }catch(e){
    document.getElementById("list").innerHTML = `<div class="empty">Couldn't load news. Try again.</div>`;
  }
}

document.getElementById("q").addEventListener("input", e => { query=e.target.value; shown=PAGE; render(); });
document.getElementById("refresh").onclick = load;
load();
</script>
</body>
</html>
